<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="interface-central">
        <h1 id="login">Login</h1>
        <form>
            <label for="username">Usuário:</label>
            <input type="text" id="username" name="username" placeholder="Digite o seu usuario" required>

            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" placeholder="Digite a sua senha" required>

            <div class="botoes-container">
                <button type="submit" id="login-button">Entrar</button>
                <button type="button" id="register-button">Criar Conta</button>
            </div>
            <p id="redefinir-senha" href="">Esqueci a senha</p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
