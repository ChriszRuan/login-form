<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="interface-central">
        <h1 id="login">Login</h1>
        <form>
            <label for="username">Usuário:</label>
            <input type="text" id="username" name="username" placeholder="Digite o seu usuario" required>

            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" placeholder="Digite a sua senha" required>

            <div class="botoes-container">
                <button type="submit" id="login-button">Entrar</button>
                <button type="button" id="register-button">Criar Conta</button>
            </div>
            <p id="redefinir-senha" href="">Esqueci a senha</p>

            <div id="modal-esqueci-senha" class="modal">
                <div class="modal-content">
                    <button type="button" class="close">X</button>
                    <h2>Redefinir Senha</h2>
                    <p>Informe o seu endereço de email para redefinir a senha.</p>
                    <input type="email" id="email" name="email" placeholder="Digite o seu email" required>
                    <button type="button" id="reset-password-button">Redefinir Senha</button>
                </div>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
